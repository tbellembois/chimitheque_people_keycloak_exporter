[package]
name = "chimitheque_people_keycloak_exporter"
version = "0.1.0"
edition = "2024"
authors = ["Thomas Bellembois <thomas.bellembois@proton.me>"]
description = "Users exporter for keycloak for Chimithèque"
license = "GPL-3.0"
repository = "https://github.com/tbellembois/chimitheque_people_keycloak_exporter"
homepage = "https://github.com/tbellembois/chimitheque_people_keycloak_exporter"
readme = "README.md"
categories = ["database", "science"]
keywords = ["chemistry", "biology", "database", "management"]
rust-version = "1.85.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# unwrap_used = "warn"
# expect_used = "warn"
# panic = "warn"
# unreachable = "warn"

missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

[dependencies]
env_logger = { version = "0.11.10", default-features = false }
log = { version = "0.4.29", default-features = false }
rusqlite = { version = "0.31.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
